<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
   
</head>
<body>
    <h1>Create Your Account</h1>
    <form action="/Register" method="post">
    <fieldset><legend>Personal Information</legend>
        <label for="fname">First Name:</label>
        <input type="text"id="fname"name="fname"required><br>
        <label for="lname">Last Name:</label>
        <input type="text"id="lname"name="lname"required><br>
    <label for="dob">Date Of Birth:</label>
    <input type="date" id="dob" name="dob"><br>
    </fieldset>
    <fieldset>
        <legend>Account Details</legend>
        <label for="email">Email:</label>
        <input type="email"id="email"name="email"required><br>
        <label for="pass">Password:</label>
        <input type="password"id="pass"name="pass"minlength="8"required><br>
        <label for="course">Course:</label>
        <select id="course"name="course">
            <optgroup label="Frontend">FrontEnd
            <option value="html">HTML Fundamentals</option>
            <option value="css">CSS Styling</option>
            <option value="js">JavaScript</option>
            </optgroup>
            <optgroup label="Backend">BackEnd
            <option value="php">PHP</option>
            <option value="pyton">Pyton</option>
            <option value="node">Node</option>
            </optgroup>
        </select><br>
    </fieldset>
    <label>
        <input type="checkbox" name="agree"required>
        I agree to the Terms and Conditions
    </label><br>
    <button type="submit">Create Account</button>
    <button type="reset">Clear</button>
</form>

</body>
</html>
